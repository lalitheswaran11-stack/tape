apiVersion: v1
kind: Service
metadata:
  name: {{ include "tape.fullname" . }}-monitor
  labels:
    {{- include "tape.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitor
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.monitor.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "tape.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: monitor
